l_english:
 
 #Religion
    hellenism: "Hellenism"
    hellenism_rebels_demand: "Convert $COUNTRYNAME$"
    hellenism_rebels_demand_desc: "The religious rebels fight for the $RELIGION$ religion. They demand that we recognize its supremacy or at the very least cease our efforts to convert them and let them worship in peace."
    hellenism_rebels_title: "Religious"
    hellenism_rebels_name: "$RELIGION$ Zealots"
    hellenism_rebels_desc: "Religious fanatics tend to rise up in provinces controlled by nations of a different faith. They seek to spread their faith and smite all unbelievers."
    hellenism_rebels_army: "$RELIGION$ Army"
    hellenism_pagan_reformed_religion_desc: "The ancient Religion of Greeks. Though largely forgotten it is still practiced and remembered in large parts of the greek world."
  #deitis
    Zeus: "Zeus"
    Zeus_desc: "Zeus is the supreme deity of the Greek pantheon. He is a sky and thunder god, who rules as king of the gods on Mount Olympus."
    Hera: "Hera"
    Hera_desc: "Hera is the goddess of marriage, women, and family, and the protector of women during childbirth. She is queen among the twelve Olympians on Mount Olympus, sister and wife of Zeus."
    Poseidon: "Poseidon"
    Poseidon_desc: "Poseidon rules over the sea, storms, earthquakes and horses. He is the protector of seafarers and the guardian of many Hellenic cities and colonies."
    Demeter: "Demeter"
    Demeter_desc: "The Goddess of the harvest, fertility, agriculture, nature and the seasons"
    Apollo: "Apollo"
    Apollo_desc: "The most beatiful god of light. He presides over light, healing, prophecy, music and poetry."
    Artemis: "Artemis"
    Artemis_desc: "Goddess of the hunt, the wilderness, nature, wild animals, archery, childbirth and chastity. She is as often said to roam the forests and mountains, attended by an entourage of nymphs"
    Ares: "Ares"
    Ares_desc: "Ares is the God of War and Courage. He embodies physical valor and strength but also brutality and bloodlust."
    Athena: "Athena"
    Athena_desc: "Athena is associated with wisdom, warfare and handicraft. She is the patron and protectress of Athens."
    Hephaestus: "Hephaestus"
    Hephaestus_desc: "Master blacksmith and craftsman of the gods. He is the god of the forge, craftsmanship, invention, fire and volcanoes"
    Aphrodite: "Aphrodite"
    Aphrodite_desc: "Goddess of love, beauty, pleasure, passion, procreation, fertility, and desire"
    Hermes: "Hermes"
    Hermes_desc: "Messenger of the gods. God of travel, commerce, communication, borders, eloquence, diplomacy, thieves, and games."
    Hestia: "Hestia"
    Hestia_desc: "Goddess of the hearth, fire and of the right ordering of domesticity and the family"
