  #South German Confederation
    SGC: "South German Confederation"
    SGC_ADJ: "South German"
    SGC_ideas: "South German Ideas"
    SGC_ideas_start: "South German Traditions"
    SGC_ideas_bonus: "South German Ambitions"
    SGC_army_reform: "South German Army Reforms"
    SGC_army_reform_desc: "The various states of South Germany have practised vastly different army tactics and reforms. We shall take the best of each to raise our army quality to a new level."
    SGC_fugger_banks: "Swabian Fugger Banks"
    SGC_fugger_banks_desc: "The swabian Fugger Family has largely replaced the medici bank. Having the largest Bank of the Empire in the heart of our State is a huge boon."
    SGC_free_cities: "Legacy of the Free Cities"
    SGC_free_cities_desc: "Our Heartlands are largely made up of numerous former Free Cities. The management that created this prosperity and those large production capabilities should be kept alive."
    SGC_swabian_league: "The Swabian League and The Swiss Confederacy"
    SGC_swabian_league_desc: "The Swabian League and The Swiss Confederacy have domited our west and we are their Legacy. We shall keep their militarism alive and lead our now united country to glory."
    SGC_bavarian_purity_law: "Bavarian Purity Law"
    SGC_bavarian_purity_law_desc: "Bring in the Bavarian Purity Law"
    SGC_hohenstaufen_emperors: "Prestige of the Hohenstaufen Dynasty"
    SGC_hohenstaufen_emperors_desc: "Prestige of the Hohenstaufen Dynasty"
    SGC_royal_order_of_st_george: "Royal Order of St. George"
    SGC_royal_order_of_st_george_desc: "Royal Order of St. George"
  #Hellenic League
    GHL: "Hellenic League"
    GHL_ADJ: "Greek"
    GHL_ideas: "Hellenic Ideas"
    GHL_ideas_start: "Hellenic Traditions"
    GHL_ideas_bonus: "Hellenic Ambitions"
    GHL_trade_cities: "Greek Trade Cities"
    GHL_trade_cities_desc: "Greek Trade Cities used to dot the mediterranean coast. It is time to bring our Trade Outposts back and reincert influence over the Mediterranean Sea"
    GHL_greek_culture: "Greek Colonization"
    GHL_greek_culture_desc: "Like once before we shall settle our People across the Sea"
    GHL_reformed_citizen_system: "Reformed Citizen System"
    GHL_reformed_citizen_system_desc: "When Cleomenes III reformed the Citizen System, to increase his available Manpower, he failed due to the war cutting his reforms short. But the merit was clear, we shall bring back his reforms in improved form."
    GHL_production_traditions: "Efficiend Workflow"
    GHL_production_traditions_desc: "Our Cities have long since been renowned for volumes of goods produces in the countryside."
    GHL_trade_power: "Trade Power"
    GHL_trade_power_desc: "Our country is positioned along one of the biggest traderoutes between the east and west. Let us use this to our advantage."
    GHL_home_of_philosophers: "Birthplace of Philosophy"
    GHL_home_of_philosophers_desc: "Birthplace of Philosophy"
    GHL_hoplite_traditions: "Hoplite Traditions"
    GHL_hoplite_traditions_desc: "Our Hoplite Infantry has long been renown for their discipline and valour."
 