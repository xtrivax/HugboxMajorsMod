l_english:

   ###GLH: Hellenic Leage###
    GHL_unite_greek_kingdoms_title: "Unite the Greek States"
    GHL_unite_greek_kingdoms_desc: "The greek World is currently splintered into varous Kingdoms and States. Some of them controlled by Latin Nobles! It is time to unite these States under Greek Leadership"
    GHL_magna_graecia_title: "Recover Megale Hellas"
    GHL_magna_graecia_desc: "Megale Hellas, the territories settled by Greek Colonies in ancient times, have long been lost. With competent leadership and a powerful navy, it is time to retake those territories and reinstate a true Greek government in the southern tip of Italy."
    GHL_carthage_title: "Carthage"
    GHL_carthage_desc: "Carthage has always been a rival to the greek states of old. It is time to settle the dispute once and for all."
    GHL_tripolitania_title: "Tripolis"
    GHL_tripolitania_desc: "The three cities might be gone, but the region is still vital for our interest in the Region."
    GHL_turkish_menace_title: "The turkish Menace"
    GHL_turkish_menace_desc: "For centuries we have struggled against foreign invaders out of anatolia and further east. Then the persians now the turks. It is time to end the threat."
    GHL_secure_northern_border_title: "Secure the Northwestern Border"
    GHL_secure_northern_border_desc:1 "If we want to put our full focus on the east we should first secure our Northwestern Border!"
    GHL_illyria_title: "Advance into Illyria"
    GHL_illyria_desc: "Illyria has never been a big focus of our Ancerstors. Maybe its time to change this."
    GHL_greece_title: "Reverse the Downfall"
    GHL_greece_desc: "The greek world has been consistently in decline since it has been conquered by the Roman Empire for about a millennium now. It is far from its glorious days in the past. It is time to change that and it starts in the heart of ancient Greece."
    GHL_bulgaria_title: "Conquer Bulgaria"
    GHL_bulgaria_desc: "Bulgaria is the door to Byzantion and Macedonia. It needs to be secured and brought into the fold to safeguard our northern Border."
    GHL_aegean_islands_title: "Repulse the Republics"
    GHL_aegean_islands_desc: "As our state expands and finds itself in a stronger position, the presence of the Latin Republics in our vicinity turns to be more of an impediment than support. It is time to end our lip service to the merchants. The Aegean islands belong to us and our [Root.GetBurghersName]."
    GHL_new_greek_golden_age_title: "A new Hellenic Age"
    GHL_new_greek_golden_age_desc: "It has been well over a millennium since the Roman Empires conquered Athens and the greek city states. But now we are back and stronger than ever. A new hellenic golden Age is upon us and the world shall know."
    GHL_coast_title: "Asia Minor"
    GHL_coast_desc: "Though already long conquered and settled by the Ottoman Turks, the western edges of Anatolia still hold a large amount of Greeks living in the cities and in coastal towns, the reconquest of those territories could prove beneficial to strengthening our maritime commerce and general strength."
    GHL_anatolia_title: "March on Anatolia"
    GHL_anatolia_desc: "With the Hellenic League looking stronger than ever and our foothold in anatolia secured we should bring an end to turkish rule in the entirety of Anatolia."
    GHL_syria_title: "The Levant"
    GHL_syria_desc: "The Levant was a vital foothold of greek city states and kingdoms. It is time for us to take the Region back."
    GHL_egypt_title: "The Ptolemaic Kingdom"
    GHL_egypt_desc: "Holding Alexandria and the delta of the Nile former heart of the greek Ptolemaic Kingdom is critical to [Root.GetName] for more reasons than one. To take full control of this province should be our utmost priority and the rule over it is bound to bring us obscene wealth and power. We will unleash its potential and all those before us shall be treated as those who could not wield the true power the region provides."
    GHL_breadbasket_title: "The Breadbasket"
    GHL_breadbasket_desc: "The Nile is the lifeline of the Egyptian civilization. Providing an outstanding supply of irrigation and therefore food, with this great river any civilization can grow in population. Having reconquered the area, let us exploit the Nile to its fullest."
    GHL_pontic_empire_title: "Trebizond"
    GHL_pontic_empire_desc: "The pontic greeks of Trebizond are fashioning themselves as successors to Rome! It is time to bring them back into the fold"
    GHL_persians_title: "Abase the Persians"
    GHL_persians_desc: "The Hellenic League has a history of centuries full of feuds with the Persians. Let us move in and deal a decisive blow to their ambitions and pride, forever thwarting their plans for lands west of the Zagros Mountains. They need to be humiliated!"
    GHL_mesopotamia_title: "In the footsteps of Alexander"
    GHL_mesopotamia_desc: "With a front against the Persians established it is time to follow Alexanders footsteps and conquer the prosperous mesopotamia."
    GHL_economic_independence_title: "Economic Independence"
    GHL_economic_independence_desc: "After 1204, the successive Byzantine Emperors tried to make Byzantine markets into an invaluable asset of the Latin merchants, granting them various privileges. It is time to show them that they are not dealing with the weak byzantine nobility anymore but the true successors of Ancient Greece."
    GHL_return_to_gold_title: "Return to Gold"
    GHL_return_to_gold_desc: "With the conquest of the valuable serbian Gold Mines we could give our coins the stability and value it needs to become the dominant economy of Europe."
    GHL_support_weavers_title: "Support the Weavers"
    GHL_support_weavers_desc: "Silk-weaving had a relatively long history in Byzantium. It is a trade we should not get lost with Byzantium. Let us support the weavers and provide them with markets for their goods."
    GHL_tarnished_state_title: "A Tarnished Region"
    GHL_tarnished_state_desc: "Our region has become tarnished by war and depopulation under the instability of the Byzantine Reign. Constant civil wars and conflicts have depleted our most invaluable asset - population. Let our lands be devastated no more and let the vacant homes not be empty any longer."
    GHL_book_of_the_eparch_title: "Improved Bookkeeping"
    GHL_book_of_the_eparch_desc: "With a growing number of merchants in our Cities, let us create new manuals and records to keep track of the local burghers."
    BYZ_at_least_10_production_income: "At least §Y10.0§!¤ Monthly Income from §YProduction§!."
    GHL_glass_ware_title: "Glass Wares of Byzantion"
    GHL_glass_ware_desc: "The glassmaking of the eastern romans had been nothing short of incredible. Famous across Europe along with the imperial silks, it would influence the Venetian Crystal and give rise to many other styles in the process. But since the Latin merchants have taken over our markets, this art seems to have been lost to time, only remaining significant in Byzantion. It is a trade we should embrace."
    GHL_city_of_worlds_desire_title: "The Heart of Greece"
    GHL_city_of_worlds_desire_desc: "Under Roman rule Athens has lost much of its importance to Byzantion. It is time to bring its light back and make Athena proud."
    GHL_megalopolis_title: "The Megalopolis"
    GHL_megalopolis_desc: "The Byzantine Population was among the most centralized of its time. The inside of Constantinopolitan walls was bustling with life and the city has grown to massive numbers. With Athens now rivaling it in Importance it is only a question of Time before it becomes a City of never seen proportions."
    GHL_athens_buff_title: "Dye Production"
    GHL_athens_buff_desc: "Under the Byzantine Empire the Tyrian Purple garments were the symbol of royalty and wealth, exceedingly rare at the time. The dye would be produced in several spots across the Empire. While the byzantine arrogance is not trait we should copy, its dye production could be a valuable trade and opportunity we should squander."
    GHL_promote_the_merchants_title: "Promote the [Root.GetBurghersName]"
    GHL_promote_the_merchants_desc: "With the Greek City States coming back to life it is time to strengthen our own merchants instead of relying on the latin ones."
    GHL_collect_our_profits_title: "Collect our Profits"
    GHL_collect_our_profits_desc: "With our support of the merchants and loans provided to the manufacturers, it is high time we collected the interest on them. We reap what we sow, and we are about to feast on the fruits of our labor."
    GHL_warehouse_of_the_east_title: "Warehouse of the East"
    GHL_warehouse_of_the_east_desc: "With our support of manufacturers and the massive growth of cities and guilds, we have risen to a rank of manufacturing Entrepôt. With many prized goods originating right here, the Greeks aren't just famous for their long and rich history, but also for the beauty of their fabrics that remains affordable to all."
    GHL_peloponesian_renaissance_title: "Peloponnesian Renaissance"
    GHL_peloponesian_renaissance_desc: "While Constantinople was in imminent danger of an invasion, a fraction of the Byzantine scholars has made Morea their home, giving the peninsula a true rebirth. Originating from Peloponnese was Gemistos Plethon, a philosopher who studied the works of Plato and had deep connections to the old beliefs."
    GHL_monemvasian_merchants_title: "Monemvasian Merchants"
    GHL_monemvasian_merchants_desc: "Monemvasia is a town off the eastern coast of Peloponnese. Situated in a unique position, the site became a local trade center, giving rise to several merchant families, among them the Notaras."
    GHL_thessaly_title: "Trade in Thessaloniki"
    GHL_thessaly_desc: "Thessaloniki used to be one of the most important greek cities. Let us restore the city to its former glories!"
    GHL_wealth_from_the_east_title: "Wealth from the East"
    GHL_wealth_from_the_east_desc: "As the Greek World expands once more, the old trade routes become lively again. We have focused on bringing our core territories to their former selves, but we should do the same to the rest of the former greek world! The wealth of the east should once again flow to Athens forevermore."
    GHL_reinforce_byzantion_title: "Reinforce Byzantion"
    GHL_reinforce_byzantion_desc: "The mighty Theodosian Walls are in disrepair and the Ottoman threat in looming. We need to take action, lest we see our walls crumble like brittle glass."
    GHL_defence_in_depth_title: "Defense in Depth"
    GHL_defence_in_depth_desc: "If we want to hold an impenetrable defense, relying on just one aspect is not going to be enough of an assurance. We need multiple sets of walls and multiple plans in order to be prepared for any knavish trick our foes might have prepared."
    GHL_hexamilion_title: "Hexamilion Wall"
    GHL_hexamilion_desc: "The Hexamilion wall used to protect the isthmus in ancient times. Recently, the wall has been repaired to protect against the Ottomans, but that has failed too. We must either commit or give up on it."
    GHL_theme_system_title: "The Byzantine Theme System"
    GHL_theme_system_desc: "The Theme System used to be the Byzantines form of civilian and military governance. Before its fall into disarray it helped govern the byzantines large territories. Maybe it is a system that would be worth copying."
    GHL_restore_navy_title: "Restore Greek Naval Dominance"
    GHL_restore_navy_desc: "With our state reborn and stronger than ever let us once again arm ourselves on the seas."
    GHL_greek_fire_title: "Sea Fire"
    GHL_greek_fire_desc: "The Greek Fire, known under many names by the Greeks, was among the most important innovations our Naval History. It is the name for a substance that was discharged onto enemy ships and lit on fire, serving as an early flamethrower. This practice has been discontinued in recent centures due to the recipee and ingredients being lost. Our smartes minds shall work on bringing this weapon back, so our navy might once again dominate."
    GHL_reform_the_themata_title: "A modern Army"
    GHL_reform_the_themata_desc: "While Theme System functions, it is woefully outdated to modern needs. We need to reform it to better suit the future - an age of gunpowder and standing armies."
    MEE_Hellenic_Events.2.t: "The Greeks of Italy"
    MEE_Hellenic_Events.2.d: "Since antiquity, the territories of southern Italy have been inhabited by Greeks, whose ancestors were settlers arriving from the east. Those peoples would see themselves reunited with the rest of the Greek world during the brief Byzantine rule, but even that tie would sever with the recession of the Eastern Roman Empire. Today, those territories are once again held by a Hellenic government, giving reassurances to the local population that their identity and rich history will be preserved under this new rule. Support of the local Greeks is sure to bolster our hold of the area."
    GHL_church_in_distress_title: "An old Faith"
    GHL_church_in_distress_desc: "The return to our true faith will no doubt spread uncertainty. But we cannot stop on our path to prosperity. Stabilise the realm and spread the faith."
    GHL_parthenon_restoration_title: "Parthenon Restoration"
    GHL_parthenon_restoration_desc: "Long has Athenas Grace protected the City named after her. But we have forsaken her for new gods and look what misery it has brought us. Let us restore the temple and hope she will once more bless our loved City."